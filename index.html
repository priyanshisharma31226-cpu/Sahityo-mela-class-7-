<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f4c5c" />
  <title>সাহিত্য মেলা — Class 7 (WBBSE) সমাধান ও প্রশ্নোত্তর</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --primary: #0f4c5c;
      --primary-dark: #09303b;
      --accent: #e36414;
      --success: #15803d;
      --danger: #b91c1c;
      --bg: #f4f7f8;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #475569;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Noto Sans Bengali", "Hind Siliguri", system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #ffffff;
      padding: 18px 14px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
    }

    header p {
      font-size: 0.88rem;
      opacity: 0.92;
      margin-top: 4px;
    }

    #installBtn {
      display: none;
      margin: 10px auto 0;
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 780px;
      margin: 16px auto;
      padding: 0 14px;
      flex: 1;
    }

    .mode-switch {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border: 1.5px solid var(--primary);
      border-radius: 10px;
      background: #ffffff;
      color: var(--primary);
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--primary);
      color: #ffffff;
    }

    .chapter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
    }

    .chap-btn {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .chap-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      margin-bottom: 16px;
    }

    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .chap-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 4px;
    }

    .author-name {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    h3.sec-title {
      font-size: 1.02rem;
      color: var(--primary);
      margin: 14px 0 8px;
      border-left: 4px solid var(--accent);
      padding-left: 8px;
    }

    .summary-box {
      background: #f8fafc;
      padding: 12px;
      border-radius: 10px;
      line-height: 1.65;
      font-size: 0.95rem;
    }

    .word-list, .qa-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .word-item {
      background: #f8fafc;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.92rem;
    }

    .qa-item {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      background: #ffffff;
    }

    .q-text {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 6px;
      color: #0f172a;
    }

    .a-text {
      font-size: 0.92rem;
      color: #334155;
      line-height: 1.6;
    }

    /* Quiz Mode */
    .quiz-option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 11px 14px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      font-size: 0.94rem;
      cursor: pointer;
    }

    .quiz-option.correct {
      background: #dcfce7;
      border-color: var(--success);
      color: var(--success);
      font-weight: 700;
    }

    .quiz-option.wrong {
      background: #fee2e2;
      border-color: var(--danger);
      color: var(--danger);
      font-weight: 700;
    }

    .btn-next {
      margin-top: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .note-footer {
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      padding: 16px 12px;
    }
  </style>
</head>
<body>
  <header>

    <div class="chapter-bar" id="chapterBar"></div>

    <div id="solutionView"></div>

          },
          {
            q: "কবিতায় কোন বিষয়টি মূলভাব হিসেবে এসেছে?",
            options: ["স্বাধীনতা ও বন্দিত্ব", "ঋতুপরিবর্তন", "গ্রাম্য মেলা", "নদীর যাত্রা"],
            ans: 0
          }
        ]
      },
      {
        id: "ch5",
        type: "গদ্য",
        title: "আকাশ",
        author: "অবনীন্দ্রনাথ ঠাকুর",
        summary: "প্রকৃতির বিশালতা ও আকাশের রূপবৈচিত্র্যকে শিশুর কৌতূহলী চোখ দিয়ে দেখার এক অনবদ্য প্রয়াস এই রচনা। নীল আকাশ, মেঘ, আলো আর দূরের হাতছানি পাঠকের কল্পনাকে প্রসারিত করে।",
        meanings: [
          { word: "দিগন্ত", meaning: "যেখানে আকাশ ও পৃথিবী মিশে গেছে বলে মনে হয়" },
          { word: "বিস্তীর্ণ", meaning: "অনেক দূর পর্যন্ত ছড়িয়ে থাকা" },
          { word: "কৌতূহল", meaning: "জানার বা বোঝার প্রবল আগ্রহ" }
        ],
        qa: [
          {
            q: "আকাশের রূপ কীভাবে সময়ের সাথে বদলায়?",
            a: "সকাল, দুপুর, বিকেল ও সন্ধ্যায় সূর্যের আলো এবং মেঘের অবস্থানের পরিবর্তনে আকাশের রঙ ও রূপ বদলাতে থাকে।"
          },
          {
            q: "আকাশ মানুষকে কী শেখায়?",
            a: "সংকীর্ণতা ছেড়ে বড় করে ভাবতে ও কল্পনার জগতকে বিস্তৃত করতে আকাশ অনুপ্রেরণা দেয়।"
          }
        ],
        mcqs: [
          {
            q: "'আকাশ' রচনাটির লেখক কে?",
            options: ["অবনীন্দ্রনাথ ঠাকুর", "বিভূতিভূষণ বন্দ্যোপাধ্যায়", "তারাশঙ্কর বন্দ্যোপাধ্যায়", "সৈয়দ মুজতবা আলী"],
            ans: 0
          },
          {
            q: "আকাশ ও পৃথিবী যেখানে মিলেছে বলে মনে হয়, তাকে কী বলে?",
            options: ["দিগন্ত", "উপত্যকা", "মোহনা", "উপকূল"],
            ans: 0
          }
        ]
      }
    ];

    let activeChapIdx = 0;
    let currentMode = "solution";
    let quizIndex = 0;
    let quizScore = 0;
    let quizAnswered = false;

    function renderChapterBar() {
      const bar = document.getElementById("chapterBar");
      bar.innerHTML = "";
      chaptersData.forEach((ch, idx) => {
        const btn = document.createElement("button");
        btn.className = "chap-btn" + (idx === activeChapIdx ? " active" : "");
        btn.textContent = `${idx + 1}. ${ch.title}`;
        btn.onclick = () => {
          activeChapIdx = idx;
          quizIndex = 0;
          quizScore = 0;
          quizAnswered = false;
          renderChapterBar();
          if (currentMode === "solution") renderSolution();
          else renderQuiz();
        };
        bar.appendChild(btn);
      });
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById("modeSolutionBtn").classList.toggle("active", mode === "solution");
      document.getElementById("modeQuizBtn").classList.toggle("active", mode === "quiz");
      document.getElementById("solutionView").style.display = mode === "solution" ? "block" : "none";
      document.getElementById("quizView").style.display = mode === "quiz" ? "block" : "none";

      if (mode === "solution") {
        renderSolution();
      } else {
        quizIndex = 0;
        quizScore = 0;
        quizAnswered = false;
        renderQuiz();
      }
    }

    function renderSolution() {
      const ch = chaptersData[activeChapIdx];
      const view = document.getElementById("solutionView");

      const meaningsHtml = ch.meanings
        .map(m => `<li class="word-item"><strong>${m.word}:</strong> ${m.meaning}</li>`)
        .join("");

      const qaHtml = ch.qa
        .map((item, i) => `
          <li class="qa-item">
            <div class="q-text">প্রশ্ন ${i + 1}: ${item.q}</div>
            <div class="a-text"><strong>উত্তর:</strong> ${item.a}</div>
          </li>
        `)
        .join("");

      view.innerHTML = `
        <div class="card">
          <span class="badge">${ch.type} • অধ্যায় ${activeChapIdx + 1}</span>
          <div class="chap-title">${ch.title}</div>
          <div class="author-name">লেখক / কবি: ${ch.author}</div>

          <h3 class="sec-title">মূলভাব ও সারসংক্ষেপ</h3>
          <div class="summary-box">${ch.summary}</div>

          <h3 class="sec-title">শব্দার্থ ও টীকা</h3>
          <ul class="word-list">${meaningsHtml}</ul>

          <h3 class="sec-title">প্রশ্নোত্তর ও সমাধান</h3>
          <ul class="qa-list">${qaHtml}</ul>
        </div>
      `;
    }

    function renderQuiz() {
      const ch = chaptersData[activeChapIdx];
      const view = document.getElementById("quizView");

      if (quizIndex >= ch.mcqs.length) {
        view.innerHTML = `
          <div class="card" style="text-align:center;">
            <span class="badge">${ch.title}</span>
            <h2>অনুশীলন সম্পন্ন!</h2>
            <p style="font-size:1.3rem; font-weight:700; color:var(--primary); margin:12px 0;">
              আপনার স্কোর: ${quizScore} / ${ch.mcqs.length}
            </p>
            <button class="btn-next" onclick="restartChapterQuiz()">আবার অনুশীলন করুন</button>
          </div>
        `;
        return;
      }

      const item = ch.mcqs[quizIndex];
      quizAnswered = false;

      const optionsHtml = item.options
        .map((opt, idx) => `<button class="quiz-option" onclick="checkQuizAnswer(${idx})">${opt}</button>`)
        .join("");

      view.innerHTML = `
        <div class="card">
          <span class="badge">${ch.title} • প্রশ্ন ${quizIndex + 1}/${ch.mcqs.length}</span>
          <div style="font-weight:700; font-size:1.05rem; margin-bottom:8px;">${item.q}</div>
          <div>${optionsHtml}</div>
          <button class="btn-next" id="nextQuizBtn" style="display:none;" onclick="nextQuizQuestion()">পরবর্তী প্রশ্ন →</button>
        </div>
      `;
    }

    function checkQuizAnswer(selectedIdx) {
      if (quizAnswered) return;
      quizAnswered = true;
      const item = chaptersData[activeChapIdx].mcqs[quizIndex];
      const buttons = document.querySelectorAll(".quiz-option");

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === item.ans) btn.classList.add("correct");
        else if (idx === selectedIdx) btn.classList.add("wrong");
      });

      if (selectedIdx === item.ans) quizScore++;
      document.getElementById("nextQuizBtn").style.display = "inline-block";
    }

    function nextQuizQuestion() {
      quizIndex++;
      renderQuiz();
    }

    function restartChapterQuiz() {
      quizIndex = 0;
      quizScore = 0;
      quizAnswered = false;
      renderQuiz();
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }

    let deferredPrompt;
    const installBtn = document.getElementById("installBtn");
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = "inline-block";
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = "none";
    });

    renderChapterBar();
    renderSolution();
  </script>
</body>
</html>
