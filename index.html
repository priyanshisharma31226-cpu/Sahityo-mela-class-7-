<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f4c5c" />
  <title>সাহিত্য মেলা ও ব্যাকরণ সূচি — Class 7</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --primary: #0f4c5c;
      --primary-dark: #082f3a;
      --accent: #d97706;
      --success: #15803d;
      --danger: #b91c1c;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Noto Sans Bengali", "Hind Siliguri", system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #ffffff;
      padding: 18px 14px;
      text-align: center;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    header p {
      font-size: 0.85rem;
      opacity: 0.92;
      margin-top: 4px;
    }

    .container {
      width: 100%;
      max-width: 820px;
      margin: 14px auto;
      padding: 0 12px;
      flex: 1;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1.5px solid var(--primary);
      background: #ffffff;
      color: var(--primary);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--primary);
      color: #ffffff;
    }

    .search-box {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #ffffff;
      font-size: 0.92rem;
      margin-bottom: 12px;
      outline: none;
    }

    .chapter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
    }

    .chap-btn {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .chap-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.05);
      margin-bottom: 16px;
    }

    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .chap-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 10px;
    }

    h3.sec-title {
      font-size: 1rem;
      color: var(--primary);
      margin: 14px 0 8px;
      border-left: 4px solid var(--accent);
      padding-left: 8px;
    }

    .summary-box {
      background: #f8fafc;
      padding: 12px;
      border-radius: 10px;
      line-height: 1.65;
      font-size: 0.93rem;
    }

    .qa-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .qa-item {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      background: #ffffff;
    }

    .q-text {
      font-weight: 700;
      font-size: 0.94rem;
      margin-bottom: 6px;
      color: #0f172a;
    }

    .a-text {
      font-size: 0.92rem;
      color: #334155;
      line-height: 1.65;
    }

    .quiz-option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 11px 14px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      font-size: 0.94rem;
      cursor: pointer;
    }

    .quiz-option.correct {
      background: #dcfce7;
      border-color: var(--success);
      color: var(--success);
      font-weight: 700;
    }

    .quiz-option.wrong {
      background: #fee2e2;
      border-color: var(--danger);
      color: var(--danger);
      font-weight: 700;
    }

    .btn-next {
      margin-top: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    footer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      padding: 16px 12px;
    }
  </style>
</head>

    <p>সূচি অনুযায়ী অধ্যায় সমাধান, প্রশ্নোত্তর ও MCQ অনুশীলন</p>

      <button class="mode-btn" id="modeQuizBtn" onclick="switchMode('quiz')">✍️ MCQ অনুশীলন</button>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="অধ্যায় বা প্রশ্ন খুঁজুন..." oninput="handleSearch()" />

    <div class="chapter-bar" id="chapterBar"></div>

    <div id="solutionView"></div>
    <div id="quizView" style="display: none;"></div>
  </main>

  <footer>

    let activeIdx = 0;
    let mode = "solution";
    let searchText = "";
    let quizIdx = 0;
    let quizScore = 0;
    let quizAnswered = false;

    function renderChapterBar() {
      const bar = document.getElementById("chapterBar");
      bar.innerHTML = "";
      chaptersData.forEach((ch, idx) => {
        const btn = document.createElement("button");
        btn.className = "chap-btn" + (idx === activeIdx ? " active" : "");
        btn.textContent = `${ch.num}. ${ch.title}`;
        btn.onclick = () => {
          activeIdx = idx;
          quizIdx = 0;
          quizScore = 0;
          quizAnswered = false;
          renderChapterBar();
          if (mode === "solution") renderSolution();
          else renderQuiz();
        };
        bar.appendChild(btn);
      });
    }

    function switchMode(newMode) {
      mode = newMode;
      document.getElementById("modeSolutionBtn").classList.toggle("active", mode === "solution");
      document.getElementById("modeQuizBtn").classList.toggle("active", mode === "quiz");
      document.getElementById("solutionView").style.display = mode === "solution" ? "block" : "none";
      document.getElementById("quizView").style.display = mode === "quiz" ? "block" : "none";
      if (mode === "solution") renderSolution();
      else {
        quizIdx = 0;
        quizScore = 0;
        quizAnswered = false;
        renderQuiz();
      }
    }

    function handleSearch() {
      searchText = document.getElementById("searchInput").value.trim().toLowerCase();
      if (mode === "solution") renderSolution();
    }

    function renderSolution() {
      const ch = chaptersData[activeIdx];
      const view = document.getElementById("solutionView");

      const filteredQa = ch.qa.filter(item =>
        !searchText ||
        ch.title.toLowerCase().includes(searchText) ||
        item.q.toLowerCase().includes(searchText) ||
        item.a.toLowerCase().includes(searchText)
      );

      const qaHtml = filteredQa.length
        ? filteredQa.map((item, i) => `
            <li class="qa-item">
              <div class="q-text">প্রশ্ন ${i + 1}: ${item.q}</div>
              <div class="a-text"><strong>উত্তর:</strong> ${item.a}</div>
            </li>
          `).join("")
        : `<li class="qa-item"><div class="a-text">কোনো প্রশ্ন পাওয়া যায়নি।</div></li>`;

      view.innerHTML = `
        <div class="card">
          <span class="badge">${ch.tag}</span>
          <div class="chap-title">${ch.num}. ${ch.title}</div>

          <h3 class="sec-title">সারসংক্ষেপ</h3>
          <div class="summary-box">${ch.summary}</div>

          <h3 class="sec-title">প্রশ্নোত্তর</h3>
          <ul class="qa-list">${qaHtml}</ul>
        </div>
      `;
    }

    function renderQuiz() {
      const ch = chaptersData[activeIdx];
      const view = document.getElementById("quizView");

      if (quizIdx >= ch.mcqs.length) {
        view.innerHTML = `
          <div class="card" style="text-align:center;">
            <span class="badge">${ch.title}</span>
            <h2>অনুশীলন শেষ!</h2>
            <p style="font-size:1.25rem; font-weight:700; color:var(--primary); margin:12px 0;">
              স্কোর: ${quizScore} / ${ch.mcqs.length}
            </p>
            <button class="btn-next" onclick="restartQuiz()">আবার চেষ্টা করুন</button>
          </div>
        `;
        return;
      }

      const item = ch.mcqs[quizIdx];
      quizAnswered = false;
      const optionsHtml = item.options
        .map((opt, idx) => `<button class="quiz-option" onclick="answerQuiz(${idx})">${opt}</button>`)
        .join("");

      view.innerHTML = `
        <div class="card">
          <span class="badge">${ch.title} • প্রশ্ন ${quizIdx + 1}/${ch.mcqs.length}</span>
          <div style="font-weight:700; font-size:1.03rem; margin-bottom:8px;">${item.q}</div>
          <div>${optionsHtml}</div>
          <button class="btn-next" id="nextQuizBtn" style="display:none;" onclick="nextQuiz()">পরবর্তী প্রশ্ন →</button>
        </div>
      `;
    }

    function answerQuiz(idx) {
      if (quizAnswered) return;
      quizAnswered = true;
      const item = chaptersData[activeIdx].mcqs[quizIdx];
      const btns = document.querySelectorAll(".quiz-option");
      btns.forEach((btn, i) => {
        btn.disabled = true;
        if (i === item.ans) btn.classList.add("correct");
        else if (i === idx) btn.classList.add("wrong");
      });
      if (idx === item.ans) quizScore++;
      document.getElementById("nextQuizBtn").style.display = "inline-block";
    }

    function nextQuiz() {
      quizIdx++;
      renderQuiz();
    }

    function restartQuiz() {
      quizIdx = 0;
      quizScore = 0;
      quizAnswered = false;
      renderQuiz();
    }

    renderChapterBar();
    renderSolution();
  </script>
</body>
</html>
